# _config.yml
# GitHub Pages configuration for The Triad of Stewardship
#
# SETUP INSTRUCTIONS:
# 1. Replace [username] with your actual GitHub username
# 2. Replace [repo-name] with whatever you name the repository
#    (suggested: triad-of-stewardship)
# 3. Save this file in the ROOT of your repository (same level as index.md)

# -----------------------------------------------
# Site identity
# -----------------------------------------------
title: "The Triad of Stewardship"
description: "A unified ethical framework derived from cross-cultural research across 23 traditions spanning five millennia. UCE · Sojournism · CRES · AI Alignment."
author: "Curtis Atwell"

# -----------------------------------------------
# GitHub Pages URL settings
# Replace both values below with your actual username and repo name
# -----------------------------------------------
url: "https://kmpauley1078-png.github.io"
baseurl: "/triad-of-stewardship"

# Example when filled in:
# url: "https://johndoe.github.io"
# baseurl: "/triad-of-stewardship"

# -----------------------------------------------
# Theme
# "minima" is the default GitHub Pages theme — clean, readable, no setup required
# -----------------------------------------------
theme: minima

# -----------------------------------------------
# Minima theme settings
# -----------------------------------------------
minima:
  skin: classic

# -----------------------------------------------
# Navigation header links
# These appear in the site's top navigation bar
# -----------------------------------------------
header_pages:
  - epistemic-status.md
  - framework/uce-overview.md
  - applications/coherence-imperative-overview.md
  - technical/tier3-overview.md
  - essays/essays-index.md

# -----------------------------------------------
# Markdown and content settings
# -----------------------------------------------
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..3

# -----------------------------------------------
# Build settings
# -----------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# -----------------------------------------------
# Files and folders to exclude from the site build
# (these won't be published as web pages)
# -----------------------------------------------
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# -----------------------------------------------
# Permalink structure
# "pretty" gives clean URLs: /framework/uce-overview/
# instead of /framework/uce-overview.html
# -----------------------------------------------
permalink: pretty

# -----------------------------------------------
# SEO and discoverability
# -----------------------------------------------
lang: en
timezone: America/Chicago
