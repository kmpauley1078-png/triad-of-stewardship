# Site identity
title: "The Triad of Stewardship"
description: "A unified ethical framework derived from cross-cultural research across 23 traditions spanning five millennia. UCE · Sojournism · CRES · AI Alignment."
author: "Kevin Pauley"

# URL settings
url: "https://kmpauley1078-png.github.io"
baseurl: "/triad-of-stewardship"

# Theme settings
theme: minima

minima:
  skin: classic

# Markdown settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..3

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

permalink: pretty

lang: en
timezone: America/Chicago