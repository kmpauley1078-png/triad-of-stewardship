# Site identity
title: "The Triad of Stewardship"
description: "A unified ethical framework derived from cross-cultural research across 23 traditions spanning five millennia. UCE · Sojournism · CRES · AI Alignment."
author: "Kevin Pauley"

# URL settings
url: "https://kmpauley.github.io"
# FORCE strict baseurl matching. Ensure your GitHub repo name is exactly "triad-of-stewardship"
baseurl: "/triad-of-stewardship"

theme: minima

minima:
  skin: classic

# Cleaned up navigation header links using relative web paths
header_pages:
  - epistemic-status.md
  - framework/uce-overview.md
  - applications/coherence-imperative-overview.md
  - technical/tier3-overview.md
  - essays/essays-index.md

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..3

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

permalink: pretty

lang: en
timezone: America/Chicago